# WM8960 Audio HAT - WirePlumber configuration
# Sets WM8960 as default sink/source with higher priority than HDMI
# Installed by WM8960 Audio HAT Drivers install.sh
#
# Deployed to: /etc/wireplumber/wireplumber.conf.d/40-wm8960-default.conf

monitor.alsa.rules = [
  {
    matches = [
      {
        alsa.card_name = "wm8960-soundcard"
        media.class = "Audio/Sink"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1500
        priority.driver  = 1500
        node.description = "WM8960 Audio HAT (Speaker/Headphone)"
      }
    }
  }
  {
    matches = [
      {
        alsa.card_name = "wm8960-soundcard"
        media.class = "Audio/Source"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1500
        priority.driver  = 1500
        node.description = "WM8960 Audio HAT (Microphone)"
      }
    }
  }
]
