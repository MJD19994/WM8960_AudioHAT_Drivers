# ALSA configuration file for WM8960 Audio HAT

# Playback device using dmix for software mixing
pcm.dmixer {
    type dmix
    ipc_key 555555
    # The shm/sem segments belong to whoever opens the device first, and the
    # root-run echo-cancel service (if installed) opens this chain at boot.
    # Without ipc_gid, a root-owned segment locks every non-root app out of
    # 'default' audio for the whole uptime. Pi OS puts the login user in the
    # audio group.
    ipc_perm 0660
    ipc_gid audio
    slave {
        pcm "hw:wm8960soundcard"
        # Uncomment below to tune buffer sizes (may help with underruns on Pi Zero):
        # period_size 1024
        # buffer_size 4096
    }
}

# Capture device using dsnoop for simultaneous recording
pcm.dsnooper {
    type dsnoop
    ipc_key 666666
    # Same group-shared IPC rationale as dmixer above -- the WebRTC EC service
    # opens dsnooper directly (-m dsnooper), so this one is hit even more often.
    ipc_perm 0660
    ipc_gid audio
    slave {
        pcm "hw:wm8960soundcard"
        channels 2
        # Uncomment below to tune buffer sizes (may help with overruns on Pi Zero):
        # period_size 1024
        # buffer_size 4096
    }
}

# Duplex device combining playback and capture
pcm.duplex {
    type asym
    playback.pcm "dmixer"
    capture.pcm "dsnooper"
}

# Set dmixer as default playback device
pcm.!default {
    type plug
    slave.pcm "duplex"
}

# Control device
ctl.!default {
    type hw
    card wm8960soundcard
}
