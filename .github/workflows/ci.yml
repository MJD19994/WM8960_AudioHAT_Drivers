name: CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on all shell scripts
        run: |
          shellcheck -s bash \
            install.sh \
            uninstall.sh \
            test-audio.sh \
            wm8960-soundcard.sh \
            wm8960-volume \
            wm8960-alsa-store \
            wm8960-diag \
            tools/echo-cancel/install.sh

  dts-compile:
    name: DTS Compilation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install device-tree-compiler
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler

      - name: Compile DTS to DTBO
        run: |
          dtc -@ -I dts -O dtb \
            -o /tmp/wm8960-soundcard.compiled.dtbo \
            kernel_module/wm8960-soundcard.dts
          echo "DTS source compiles successfully"

      - name: Verify shipped DTBO matches DTS source
        run: |
          # Decompile both to canonical DTS and compare
          dtc -I dtb -O dts -o /tmp/shipped.dts kernel_module/wm8960-soundcard.dtbo 2>&1 | head -20 || true
          dtc -I dtb -O dts -o /tmp/compiled.dts /tmp/wm8960-soundcard.compiled.dtbo 2>&1 | head -20 || true

          if diff -q /tmp/shipped.dts /tmp/compiled.dts > /dev/null 2>&1; then
            echo "Shipped .dtbo matches .dts source"
          else
            echo "::error::Shipped .dtbo does not match .dts source. Recompile with: dtc -@ -I dts -O dtb -o kernel_module/wm8960-soundcard.dtbo kernel_module/wm8960-soundcard.dts"
            diff /tmp/shipped.dts /tmp/compiled.dts || true
            exit 1
          fi
